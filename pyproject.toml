[project]
name = "he-thong-data-tai-chinh-test"
version = "0.7.3"
requires-python = "==3.12.*"

dependencies = [
    "vnstock==4.0.9",
    "vnai==2.6.3",
    "fastapi>=0.117,<1",
    "uvicorn[standard]>=0.30,<1",
    "pandas>=2.2,<3",
    "httpx>=0.27,<1",
    "lxml>=5,<7",
    "html5lib>=1.1,<2",
    "beautifulsoup4>=4.12,<5",
]

[tool.vercel]
entrypoint = "app.main:app"

[[tool.uv.index]]
name = "vnstock-official"
url = "https://vnstocks.com/api/simple"
explicit = true

[tool.uv.sources]
vnstock = { index = "vnstock-official" }
vnai = { index = "vnstock-official" }
